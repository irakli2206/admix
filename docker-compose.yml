# Production-style run (VPS): persistent ADMIXTURE job dir, optional binary mount.
#   docker compose up -d --build
# Copy env:  cp .env.local .env   (or set variables in shell / hosting panel)
#
# ADMIXTURE binary on host: mount dir + set ADMIXTURE_EXTRA_PATH (see DEPLOY.md).
# PLINK triplet on host: mount read-only + ADMIXTURE_HOST_PLINK_ROOT (POST /admixture/jobs, omit bundle).
# qpAdm: ADMIXTOOLS 2 (R) is built into the image; mount AADR reference + f2 cache volume.

services:
  api:
    build: .
    container_name: admix-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ADMIXTURE_ENABLED: ${ADMIXTURE_ENABLED:-true}
      ADMIXTURE_JOBS_ROOT: /data/admixture_jobs
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ADMIXTURE_EXTRA_PATH: ${ADMIXTURE_EXTRA_PATH:-/host/admixture}
      ADMIXTURE_BIN: ${ADMIXTURE_BIN:-admixture}
      ADMIXTURE_HOST_PLINK_ROOT: ${ADMIXTURE_HOST_PLINK_ROOT:-/var/admixture/plink}
      QPADM_ENABLED: ${QPADM_ENABLED:-true}
      QPADM_JOBS_ROOT: /data/qpadm_jobs
      QPADM_F2_DIR: ${QPADM_F2_DIR:-/data/qpadm_f2}
      QPADM_ALLOWED_PATH_PREFIXES: ${QPADM_ALLOWED_PATH_PREFIXES:-/var/qpadm/ref}
      QPADM_DEFAULT_GENO: ${QPADM_DEFAULT_GENO:-/var/qpadm/ref/AADR/v62.0_1240k_public.geno}
      QPADM_DEFAULT_SNP: ${QPADM_DEFAULT_SNP:-/var/qpadm/ref/AADR/v62.0_1240k_public.snp}
      QPADM_DEFAULT_IND: ${QPADM_DEFAULT_IND:-/var/qpadm/ref/AADR/v62.0_1240k_public.ind}
    volumes:
      - admixture_jobs:/data/admixture_jobs
      - qpadm_jobs:/data/qpadm_jobs
      - qpadm_f2:/data/qpadm_f2
      - /opt/admixture:/host/admixture:ro
      - /var/admixture/plink:/var/admixture/plink:ro
      - /var/qpadm/ref:/var/qpadm/ref:ro

volumes:
  admixture_jobs:
  qpadm_jobs:
  qpadm_f2:
