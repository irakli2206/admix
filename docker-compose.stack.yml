# Two containers, one image: G25 public (8000) + qpAdm internal (8001).
# Build: docker compose -f docker-compose.stack.yml build
# Run:   INTERNAL_API_KEY='your-secret' docker compose -f docker-compose.stack.yml up -d
# Or put INTERNAL_API_KEY in a .env file next to this compose file.

services:
  admix-g25:
    image: admix-api
    build: .
    container_name: admix-g25
    ports:
      - "8000:8000"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      CONVERSION_ENABLED: "true"
      QPADM_ENABLED: "false"
    restart: unless-stopped

  admix-qpadm:
    image: admix-api
    build: .
    container_name: admix-qpadm
    ports:
      - "8001:8000"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      CONVERSION_ENABLED: "false"
      QPADM_ENABLED: "true"
      QPADM_EXTRA_PATH: /opt/admixtools/bin
    volumes:
      - /var/qpadm/ref:/var/qpadm/ref:ro
      - /opt/admixtools/src/bin:/opt/admixtools/bin:ro
    restart: unless-stopped
